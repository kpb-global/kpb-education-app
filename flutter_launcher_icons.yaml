# Configuration de secours, utilisable avec :
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
# La configuration par défaut vit dans pubspec.yaml ; les deux doivent rester
# identiques. Les blocs web/windows/macos ont été retirés : ils pointaient sur
# "path/to/image.png" et auraient fait échouer toute exécution.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  ios: true
  # Nom exact de l'option (`remove_alpha_channel_ios` n'existe pas).
  remove_alpha_ios: true
