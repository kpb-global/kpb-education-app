name: Uptime backstop

# A free, zero-dependency safety net (KPB-167): every 15 minutes it checks that
# the API and the admin answer, and FAILS the run when they don't — which sends
# the repo's usual failure notification.
#
# HONEST LIMITS — this is a backstop, not a monitoring product:
#   • GitHub's scheduled runs are best-effort: they can be delayed by many
#     minutes or skipped entirely under load.
#   • Scheduled workflows are auto-disabled after 60 days without repo activity.
#   • There is no escalation, no SMS, no on-call.
# So keep a real external monitor as the primary alert (UptimeRobot,
# healthchecks.io — both have free tiers). See docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API — liveness and readiness
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::notice::VPS_HEALTH_URL is not set — nothing to probe."
            exit 0
          fi
          # --retry absorbs a single transient blip; a real outage still fails.
          curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
            "${HEALTH_URL}/api/health/live" >/dev/null
          echo "live ✅"
          # `ready` also proves the PostgreSQL connection, so it catches a DB
          # outage that liveness alone would miss.
          curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
            "${HEALTH_URL}/api/health/ready" >/dev/null
          echo "ready ✅ (API + database)"

      - name: Admin and legal pages
        env:
          ADMIN_URL: ${{ secrets.VPS_ADMIN_URL }}
          WEB_URL: ${{ secrets.VPS_WEB_URL }}
        run: |
          set -euo pipefail
          if [ -n "${ADMIN_URL:-}" ]; then
            curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
              -o /dev/null "$ADMIN_URL"
            echo "admin ✅"
          fi
          # The legal pages are referenced from the store listings, so a 404
          # here is a compliance problem, not just a broken link.
          if [ -n "${WEB_URL:-}" ]; then
            curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
              -o /dev/null "${WEB_URL}/confidentialite.html"
            echo "legal pages ✅"
          fi
