name: VPS ops (feature flag / catalogue)

# Deux opérations de production que le runbook demandait de faire À LA MAIN en
# SSH, et que personne ne pouvait faire depuis un poste de travail : le port 22
# du VPS n'y est pas joignable (`db-info.yml` le documente déjà). Résultat
# mesuré : la vitrine « Études en France » est restée éteinte deux revues de
# suite, et 34 fiches de bourses vérifiées sont restées invisibles pendant que
# l'app en servait 10.
#
# Un runbook qu'on ne peut pas exécuter n'est pas un runbook.
#
# ── CE QUE CE WORKFLOW N'EST PAS ────────────────────────────────────────────
#
# Ce n'est PAS un exécuteur de commandes. Il n'accepte aucune commande, aucun
# nom de variable. `action` est une liste fermée d'opérations écrites ici, en clair,
# relisibles en revue. Un workflow qui prendrait une commande en entrée aurait
# transformé un secret de déploiement en shell distant pour quiconque peut cliquer
# sur « Run workflow ».
#
# Les seules valeurs libres sont les trois d'`eef-publish` (une adresse, un entier,
# un identifiant d'établissement), bornées par une expression régulière sur la valeur
# entière avant d'atteindre le serveur, puis une seconde fois par le script.
#
# Les seules clés que les branches `eef-*` écrivent dans le `.env` sont les
# `KPB_EEF_*` (vitrine, espace, fenêtre de campagne) et `KPB_RECOMMENDED_APP_VERSION`
# (bandeau doux de mise à jour, jamais `KPB_MIN_APP_VERSION`), aux valeurs écrites dans
# `.github/scripts/vps-ops.sh` : en changer une passe par une PR. Le fichier est sauvegardé avant écriture, et la clé
# est REMPLACÉE si elle existe déjà plutôt qu'ajoutée en double — un `.env` avec
# deux fois la même clé prend la dernière, ce qui rend le fichier illisible pour
# la personne qui le relit ensuite.
#
# ── PUBLICATION DU CATALOGUE ────────────────────────────────────────────────
#
# `publish-catalog` suit `docs/catalog-verification-sop.md`, à UNE différence
# près, délibérée et expliquée là-bas : PAS de `--confirmed-only`. Ce drapeau
# écarte par construction toute fiche dont le cycle est estimé — c'est-à-dire
# exactement les bourses « à venir » que l'app sait désormais afficher
# (« À venir, généralement aux mois de … »). C'est lui qui laissait 22 fiches
# sur 34 hors ligne, dont les six licences panafricaines.
#
# Depuis le 31/08/2026, l'action enchaîne `import` → `reconcile` → `switch`.
# `import` ne relit jamais une ligne existante — c'est voulu, et c'est pour cela
# qu'une correction relue en PR n'atteignait JAMAIS la production une fois la
# fiche créée : deux fiches servaient encore un cycle « estimated » là où le
# dépôt disait « confirmed » depuis le 24/08. `reconcile` ferme cet écart, et
# le `dry_run` le LISTE champ par champ au lieu de le taire derrière un
# compteur de fiches « sautées ».
#
# `reconcile` ne publie ni n'approuve aucune fiche : il n'écrit ni `isActive` ni
# `moderationStatus`, et sa transaction est annulée si l'état de modération
# d'une seule fiche a bougé pendant l'opération. Approuver reste l'affaire de
# `switch`, sur décision explicite.
#
# Le défaut est `dry_run: true`. Rien ne change tant qu'on ne l'a pas décoché.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Opération à exécuter'
        type: choice
        required: true
        options:
          - show-state
          - eef-teaser-on
          - eef-teaser-off
          - eef-space-on
          - eef-space-off
          - eef-campaign-set
          - recommended-version-set
          - publish-catalog
          - recreate-clamav
          - import-partners
          - backfill-tuition-eur
          - fix-mundiapolis-levels
          - import-universiapolis
          - reconcile-program-ids
          - backfill-seed-institutions
          - eef-import
          - eef-purge-pending
          - eef-publish
          - reviews-purge-orphans
      dry_run:
        description: 'Simuler seulement (eef-space-on, eef-campaign-set, recommended-version-set, publish-catalog, import-partners, backfill-tuition-eur, fix-mundiapolis-levels, import-universiapolis, reconcile-program-ids, backfill-seed-institutions, eef-import, eef-purge-pending, eef-publish, reviews-purge-orphans). Décocher pour appliquer.'
        type: boolean
        required: false
        default: true
      # ── Réservés à `eef-publish` ────────────────────────────────────────────
      # Ce ne sont PAS des commandes : trois valeurs bornées par une expression
      # régulière AVANT d'atteindre le VPS (voir « Exécuter l'opération »), et
      # relues par le script, qui les valide une seconde fois. L'e-mail ne désigne
      # pas qui exécute : il désigne un compte administrateur EXISTANT, actif,
      # `admin` ou `super_admin`, que le script retrouve en base — et la personne qui
      # a cliqué (`github.actor`) est inscrite à côté, dans le tampon et l'audit.
      verifier_email:
        description: 'eef-publish : e-mail du compte administrateur qui signe la publication (vide = l’unique super_admin actif, à défaut l’unique compte admin ; s’il y en a plusieurs, le job refuse et liste les comptes masqués).'
        type: string
        required: false
        default: ''
      expected_programs:
        description: 'eef-publish, application seulement : le total « TOTAL publiable » annoncé par la simulation. Un autre nombre, et rien n’est écrit.'
        type: string
        required: false
        default: ''
      institution_id:
        description: 'eef-publish : limiter à UN établissement (eef-univ-…), pour un essai. Vide = tous.'
        type: string
        required: false
        default: ''
      exclude_procedure:
        description: 'eef-publish : laisser une famille de procédure hors de cette vague (elle reste importée, inactive). « aucune » = tout publier.'
        type: choice
        required: false
        default: aucune
        options:
          - aucune
          - hors_eef
          - dap_jaune
          - parcoursup

# Groupe PARTAGÉ avec `deploy.yml` (`deploy-vps`), pas un groupe à nous.
#
# Deux groupes distincts laissaient une opération de drapeau s'entrelacer avec
# une release : `recreate_api_same_image` relit le tag sur le conteneur en
# cours, et ce tag est MUTABLE — `deploy.yml` le réécrit pendant
# `docker compose build`. Selon l'ordre, on démarrait l'image fraîchement
# reconstruite AVANT ses migrations et sa barrière de santé, ou on remettait
# l'ancienne image APRÈS la release.
#
# Sérialiser est la seule vraie parade : un tag ne peut pas être rendu immuable
# depuis `image: kpb-backend:${KPB_IMAGE_TAG}`, qui n'accepte qu'un tag.
# `cancel-in-progress: false` fait attendre, jamais annuler — un déploiement à
# moitié fait est pire qu'un drapeau qui arrive une minute plus tard.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # L'App ID OneSignal que l'APP embarque réellement, extrait de la source
      # plutôt que recopié à la main. C'est une valeur publique — elle voyage
      # dans le binaire, un `strings` sur l'IPA la donne — et c'est ce qui
      # permet au script de dire si le serveur cible la MÊME application. Une
      # constante recopiée aurait fini par diverger de `app_config.dart` sans
      # que personne ne le voie, et la comparaison aurait alors validé un écart.
      - name: Lire l'App ID OneSignal embarqué par l'app
        id: onesignal
        run: |
          set -euo pipefail
          app_id="$(sed -n "/KPB_ONESIGNAL_APP_ID/,/)/p" lib/app/core/config/app_config.dart \
            | sed -n "s/.*defaultValue: '\\([^']*\\)'.*/\\1/p" | head -1)"
          [ -n "$app_id" ] || { echo "::error::App ID OneSignal introuvable dans app_config.dart"; exit 1; }
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "App ID embarqué par l'app : $app_id"

      # Le destinataire IA à déclarer aux stores est écrit dans la fiche
      # consoles, pas dans ce script. On le LIT donc, au lieu de le figer :
      # un nom en dur ici se désynchronise de la fiche à la première
      # migration de fournisseur — et c'est exactement ce qui est arrivé,
      # la garde criant « la fiche dit Groq » APRÈS que la fiche eut été
      # corrigée en OpenRouter.
      - name: Lire le destinataire IA déclaré par la fiche consoles
        id: llm
        run: |
          set -euo pipefail
          declared="$(grep -m1 -E '^\| *[^|]*\(LLM\)' docs/CONSOLE_ANSWERS.md \
            | sed -E 's/^\| *([^|(]+).*/\1/' \
            | tr '[:upper:]' '[:lower:]' | tr -d ' *' )"
          [ -n "$declared" ] || { echo "::error::Aucune ligne « (LLM) » dans le tableau des sous-traitants de docs/CONSOLE_ANSWERS.md — la garde ne peut rien comparer."; exit 1; }
          echo "declared=$declared" >> "$GITHUB_OUTPUT"
          echo "Destinataire IA déclaré par la fiche : $declared"

      # Le catalogue GÉNÉRAL (les autres espaces) relevé AVANT : l'étape de preuve compare
      # ce qu'il sert APRÈS. « Ces formations n'apparaissent que dans l'espace Études en
      # France » est une promesse qu'on mesure, pas qu'on imprime.
      - name: Relever le catalogue général avant publication
        if: ${{ inputs.action == 'eef-publish' }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          inst="$(curl -fsS "${HEALTH_URL}/api/catalog/institutions" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          prog="$(curl -fsS "${HEALTH_URL}/api/catalog/programs" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          echo "GENERAL_BEFORE=${inst}/${prog}" >> "$GITHUB_ENV"
          echo "Catalogue général avant : ${inst} établissement(s), ${prog} formation(s)"

      - name: Exécuter l'opération
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_ONESIGNAL_APP_ID: ${{ steps.onesignal.outputs.app_id }}
          EXPECTED_LLM_PROVIDER: ${{ steps.llm.outputs.declared }}
          EEF_VERIFIER_EMAIL: ${{ inputs.verifier_email }}
          EEF_EXPECTED_PROGRAMS: ${{ inputs.expected_programs }}
          EEF_INSTITUTION_ID: ${{ inputs.institution_id }}
          EEF_EXCLUDE_PROCEDURE: ${{ inputs.exclude_procedure }}
          # `triggering_actor`, pas `actor` : à un « Re-run », `actor` reste celui qui a
          # lancé la première fois, `triggering_actor` est celui qui relance MAINTENANT.
          EEF_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # Les valeurs libres d'`eef-publish` sont bornées ICI, avant de composer la
          # ligne de commande envoyée au VPS : une adresse, un entier, un identifiant
          # d'établissement, un nom d'utilisateur GitHub, un choix fermé. Rien d'autre
          # ne passe. Pour les autres actions elles ne sont ni lues ni contrôlées : un
          # login GitHub atypique ne doit pas bloquer `eef-space-off`.
          # `[[ =~ ]]` teste la valeur ENTIÈRE : `grep` ne teste que ses lignes, et une
          # valeur « adresse valide + retour à la ligne + commande » l'aurait franchi.
          bounded() { # nom valeur motif
            if [ -n "$2" ] && { [ "${#2}" -gt 254 ] || ! [[ "$2" =~ $3 ]]; }; then
              echo "::error::$1 n'a pas la forme attendue — refus avant d'atteindre le serveur."
              exit 1
            fi
          }
          if [ "$ACTION" = "eef-publish" ]; then
            bounded verifier_email "$EEF_VERIFIER_EMAIL" '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
            bounded expected_programs "$EEF_EXPECTED_PROGRAMS" '^[0-9]{1,6}$'
            bounded institution_id "$EEF_INSTITUTION_ID" '^eef-univ-[A-Za-z0-9-]{1,60}$'
            bounded exclude_procedure "$EEF_EXCLUDE_PROCEDURE" '^(aucune|hors_eef|dap_jaune|parcoursup)$'
            bounded github.triggering_actor "$EEF_ACTOR" '^[A-Za-z0-9][A-Za-z0-9-]{0,38}(\[bot\])?$'
          fi
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            .github/scripts/vps-ops.sh "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/vps-ops.sh"
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "VPS_PATH='${VPS_PATH}' ACTION='${ACTION}' DRY_RUN='${DRY_RUN}' EXPECTED_ONESIGNAL_APP_ID='${EXPECTED_ONESIGNAL_APP_ID}' EXPECTED_LLM_PROVIDER='${EXPECTED_LLM_PROVIDER}' EEF_VERIFIER_EMAIL='${EEF_VERIFIER_EMAIL}' EEF_EXPECTED_PROGRAMS='${EEF_EXPECTED_PROGRAMS}' EEF_INSTITUTION_ID='${EEF_INSTITUTION_ID}' EEF_EXCLUDE_PROCEDURE='${EEF_EXCLUDE_PROCEDURE}' EEF_ACTOR='${EEF_ACTOR}' bash '${VPS_PATH}/vps-ops.sh'; rc=\$?; rm -f '${VPS_PATH}/vps-ops.sh'; exit \$rc"

      # Ce que l'app lira vraiment, depuis l'extérieur : le catalogue GÉNÉRAL (celui des
      # autres espaces) n'a pas bougé d'une ligne — la promesse « ces formations
      # n'apparaissent que dans l'espace Études en France » — et la recherche Études en
      # France reflète la publication. Un écart FAIT ÉCHOUER le job : il se lit, il ne
      # s'imprime pas au milieu d'un journal.
      - name: Prouver l'isolation (catalogue général inchangé, recherche Études en France)
        if: ${{ always() && inputs.action == 'eef-publish' && env.GENERAL_BEFORE != '' }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          inst="$(curl -fsS "${HEALTH_URL}/api/catalog/institutions" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          prog="$(curl -fsS "${HEALTH_URL}/api/catalog/programs" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          echo "Catalogue général après : ${inst} établissement(s), ${prog} formation(s) (avant : ${GENERAL_BEFORE})"
          curl -fsS "${HEALTH_URL}/api/etudes-en-france/search?limit=1" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Recherche Études en France : total =", d.get("total"), "| catalogPublished =", d.get("catalogPublished"))'
          if [ "${inst}/${prog}" != "${GENERAL_BEFORE}" ]; then
            echo "::error::Le catalogue général a changé pendant la publication (${GENERAL_BEFORE} -> ${inst}/${prog}). Vérifier avant toute autre action : une modification légitime par un administrateur au même moment est possible, une fuite des lignes de l'import ne l'est pas."
            exit 1
          fi

      - name: Vérifier depuis l'extérieur ce que le serveur annonce vraiment
        if: ${{ always() && inputs.action != 'publish-catalog' }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          # La preuve ne vient pas du serveur qu'on vient de toucher : elle vient
          # de ce que l'app lira réellement.
          curl -fsS "${HEALTH_URL}/api/config/app" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("features:", json.dumps(d.get("features"), ensure_ascii=False)); print("eefCampaign:", json.dumps(d.get("eefCampaign"), ensure_ascii=False)); print("minVersion:", d.get("minVersion"), "| recommendedVersion:", d.get("recommendedVersion")); print("eefCatalog:", json.dumps(d.get("eefCatalog"), ensure_ascii=False))'

      # L'ouverture ou la fermeture de l'espace se PROUVE depuis l'extérieur, pas
      # par le code de sortie du script : ce que l'app lira, c'est `/config/app`.
      # Et `eef` doit rester éteint — c'est lui qui retirerait la vitrine des
      # builds 49 à 53.
      - name: Prouver l'état de l'espace (eefSpace)
        if: ${{ success() && ((inputs.action == 'eef-space-on' && !inputs.dry_run) || inputs.action == 'eef-space-off') }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          WANT_OPEN: ${{ inputs.action == 'eef-space-on' }}
        run: |
          set -euo pipefail
          curl -fsS "${HEALTH_URL}/api/config/app" | python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          features = d.get("features") or {}
          want = os.environ["WANT_OPEN"] == "true"
          assert "eefSpace" in features, "features.eefSpace absent : ancienne image en production"
          got = features["eefSpace"]
          assert got is want, "features.eefSpace=%r, attendu %r" % (got, want)
          assert features.get("eef") is False, "features.eef est vrai : la vitrine des builds 49 a 53 a disparu"
          if want:
              # Ce que l'espace de la 54 affiche doit etre servi : sans la mention
              # de paternite du catalogue, l'ouverture est incomplete.
              assert d.get("eefCatalog"), "eefCatalog absent : le backend ne porte pas la build 54 cote serveur"
              assert (d.get("eefCampaign") or {}).get("platformUrl"), "eefCampaign.platformUrl absent : aucun lien vers la plateforme officielle"
          print("eefSpace =", features["eefSpace"], "| eef =", features["eef"], "| eefTeaser =", features.get("eefTeaser"))
          '
