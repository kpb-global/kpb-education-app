name: Deploy backend (VPS)

# Automates the manual SSH procedure documented in docs/DEPLOYMENT.md, with a
# health gate and an automatic code rollback (KPB-167).
#
# MANUAL ON PURPOSE: deploying is a decision, not a side effect of merging. Run
# it from the Actions tab when you want prod to move. (To make it automatic
# later, add a `workflow_run` trigger on a green Backend CI.)
#
# What it does, in the same order as the validated runbook:
#   sync code → build images → pg_dump backup → prisma migrate deploy →
#   replace api+admin → ASSERT the new tag is the one running → health gate →
#   rollback the CODE if unhealthy.
#
# Note on rollback: migrations are forward-only, so the rollback restores the
# previous IMAGE, not the schema. That is safe because every migration in this
# repo is additive (new nullable/defaulted columns), which older code ignores.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag or SHA)'
        required: false
        default: 'main'
      run_seed:
        description: 'Run prisma:seed after migrating (first install only)'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the image tag from the deployed commit
        id: meta
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key instead of disabling verification.
          #
          # Avec réessais, et ce n'est pas de la superstition : le lien entre les
          # runners GitHub et ce VPS tombe par intermittence. Trois modes
          # d'échec observés le 12 et le 13/08/2026 — sondes de disponibilité en
          # `Connection timed out` sur /api/health, et ce `ssh-keyscan` sorti en
          # échec au bout de ses 5 secondes de délai par défaut — alors que
          # l'hôte répondait normalement depuis ailleurs à la même minute.
          # Sans réessai, un déploiement échoue pour une raison qui n'a rien à
          # voir avec le code, et l'opérateur en déduit ce qu'il peut.
          keyscanned=0
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              keyscanned=1; break
            fi
            echo "ssh-keyscan attempt $attempt failed — retrying in 10s"
            sleep 10
          done
          if [ "$keyscanned" != "1" ]; then
            echo "::error::ssh-keyscan could not reach $VPS_HOST after 5 attempts."
            echo "::error::The host may be fine: check it from elsewhere before assuming an outage."
            exit 1
          fi

      - name: Sync code to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          # Only what the compose build contexts need. `.env`, `backups/` and
          # `node_modules` live only on the VPS and are never touched (no
          # --delete, and git does not track them).
          #
          # KNOWN GAP, left as is on purpose: without --delete, a file removed
          # from the repo survives on the VPS forever. That protects `.env` and
          # `backups/`, but it also means a deleted page under web/public/ keeps
          # being served. Deleting one requires an `rm` on the VPS by hand, or a
          # narrower --delete scoped to web/ only.
          rsync -az --info=stats1 \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            backend admin web docker-compose.yml \
            "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/"

      - name: Build, migrate, release (health-gated, auto-rollback)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_SHA: ${{ steps.meta.outputs.sha }}
          RUN_SEED: ${{ inputs.run_seed }}
        run: |
          set -euo pipefail

          # The remote script is COPIED, then executed with stdin closed — it is
          # never piped into `bash -s`.
          #
          # Why this matters (learned the hard way on run #1, 2026-07-27): when
          # the script arrives on stdin, the first command that reads stdin —
          # `docker compose exec` and `docker compose run` both do — swallows
          # the REST OF THE SCRIPT as input. Bash then hits EOF and exits 0.
          # That run built the images, ate its own migrate/release/health-gate
          # steps, and reported success while production kept serving the old
          # container. A deploy that lies is worse than a deploy that fails.
          cat > /tmp/kpb-deploy.sh <<'REMOTE'
          set -euo pipefail
          cd "$VPS_PATH"
          export KPB_IMAGE_TAG="$IMAGE_TAG" KPB_BUILD_SHA="$BUILD_SHA"

          # Remember what is running so we can put it back.
          PREV_IMAGE="$(docker inspect --format '{{.Config.Image}}' kpb_api 2>/dev/null || true)"
          PREV_TAG="${PREV_IMAGE##*:}"
          echo "Currently running: ${PREV_IMAGE:-none} (tag ${PREV_TAG:-none})"

          echo "── build ──"
          docker compose build api admin

          echo "── backup (expands \$POSTGRES_USER INSIDE the db container) ──"
          mkdir -p backups
          # `< /dev/null` belt-and-braces: even if this script is ever fed on
          # stdin again, no docker command can consume it.
          docker compose exec -T db sh -c \
            'pg_dump -U "$POSTGRES_USER" -d "${POSTGRES_DB:-kpb}" --format=custom' \
            < /dev/null \
            > "backups/predeploy-${IMAGE_TAG}-$(date +%Y%m%d-%H%M%S).dump"
          # A truncated dump must stop the deploy, not be discovered later.
          LATEST_DUMP="$(ls -t backups/predeploy-*.dump | head -1)"
          if [ ! -s "$LATEST_DUMP" ]; then
            echo "::error::pre-deploy dump is empty ($LATEST_DUMP) — aborting"
            exit 1
          fi
          echo "backup ok: $(du -h "$LATEST_DUMP" | cut -f1) $LATEST_DUMP"

          echo "── migrate ──"
          docker compose run --rm --no-deps api npx prisma migrate deploy < /dev/null

          if [ "$RUN_SEED" = "true" ]; then
            echo "── seed (explicitly requested) ──"
            docker compose exec -T api npm run prisma:seed < /dev/null
          fi

          echo "── release ──"
          # `web` is in the list so a NEW image or a CHANGED service definition
          # reaches kpb_web. It is NOT what loads a new web/nginx.conf: compose
          # leaves an unchanged container running, and the file mount is resolved
          # by inode anyway. The recreate step after the health gate does that.
          #
          # `clamav` is deliberately NOT in the list. Upload scanning is
          # fail-closed, so recreating it would 503 every profile-photo upload
          # for the minutes clamd spends loading its signatures. It has no code
          # from this repo in it and nothing to redeploy.
          docker compose up -d --no-deps api admin web < /dev/null

          # The release assertion. "Something answers" is NOT "the new version is
          # serving": run #1 passed every health check while the two-day-old
          # container was still up. Compare what actually runs to what we built.
          echo "── assert the built image is the one running ──"
          RUNNING_IMAGE="$(docker inspect --format '{{.Config.Image}}' kpb_api)"
          RUNNING_TAG="${RUNNING_IMAGE##*:}"
          if [ "$RUNNING_TAG" != "$IMAGE_TAG" ]; then
            echo "::error::kpb_api runs '$RUNNING_IMAGE' but this deploy built tag '$IMAGE_TAG' — the release did not take"
            exit 1
          fi
          echo "running: $RUNNING_IMAGE"

          echo "── health gate ──"
          healthy=0
          for i in $(seq 1 20); do
            sleep 5
            if curl -fsS "${HEALTH_URL}/api/health/ready" >/dev/null 2>&1; then
              healthy=1; break
            fi
            echo "not ready yet (attempt $i)"
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::API unhealthy after deploy — rolling back the code"
            if [ -n "${PREV_TAG:-}" ] && [ "$PREV_TAG" != "$IMAGE_TAG" ]; then
              KPB_IMAGE_TAG="$PREV_TAG" docker compose up -d --no-deps api admin web < /dev/null
              echo "rolled back to $PREV_TAG"
            else
              echo "::warning::no distinct previous tag to roll back to"
            fi
            docker compose logs --tail=80 api || true
            exit 1
          fi

          # `web/nginx.conf` est bind-monté FICHIER À FICHIER, et Docker résout
          # ce montage par inode au démarrage du conteneur. `rsync` écrit un
          # fichier temporaire puis le renomme : le chemin de l'hôte porte donc
          # le nouveau contenu sous un NOUVEL inode, tandis que le conteneur
          # continue de lire l'ancien, désormais sans nom.
          #
          # Conséquence mesurée le 13/08/2026 : un `nginx -s reload` réussit,
          # annonce « syntax is ok », et ne change rien — il relit le même
          # ancien fichier. Le rechargement seul est un placebo ; seule la
          # recréation du conteneur ré-résout le montage.
          #
          # Le fichier NEUF est validé avant qu'on y touche, dans un conteneur
          # jetable : si sa syntaxe est mauvaise, le déploiement s'arrête et le
          # site en production continue de servir l'ancienne configuration.
          # Valider dans le conteneur en cours ne prouverait rien — il teste le
          # fichier qu'il a déjà, pas celui qu'on veut installer.
          #
          # Placé APRÈS le portail de santé pour que le filet de l'API et son
          # retour arrière automatique aient joué en premier.
          echo "── reload web config ──"
          docker run --rm -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t < /dev/null
          docker compose up -d --no-deps --force-recreate web < /dev/null
          echo "kpb_web recreated with the current nginx.conf"

          # Written proof of the schema state, in every run's log. Without this,
          # "did the migration apply?" is answered by presumption.
          echo "── schema state ──"
          docker compose run --rm --no-deps api npx prisma migrate status < /dev/null

          echo "── running images ──"
          docker compose images api admin
          rm -f /tmp/kpb-deploy.sh
          echo "DEPLOY OK ✅ (tag $IMAGE_TAG)"
          REMOTE

          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            /tmp/kpb-deploy.sh "${VPS_USER}@${VPS_HOST}:/tmp/kpb-deploy.sh"

          # -n closes stdin for good measure; the script now lives in a file.
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            IMAGE_TAG="$IMAGE_TAG" BUILD_SHA="$BUILD_SHA" \
            VPS_PATH="$VPS_PATH" HEALTH_URL="$HEALTH_URL" RUN_SEED="$RUN_SEED" \
            bash /tmp/kpb-deploy.sh

      - name: Verify from the outside
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          WEB_URL: ${{ secrets.VPS_WEB_URL }}
        run: |
          set -euo pipefail
          curl -fsS "${HEALTH_URL}/api/health/live"
          curl -fsS "${HEALTH_URL}/api/health/ready"
          # A 200 only proves something answers. This proves the catalogue is
          # served from PostgreSQL and not from the in-repo mock fallback — the
          # shortest external evidence that this build's code is the one running.
          curl -fsS "${HEALTH_URL}/api/catalog/scholarships" \
            | grep -q '"source":"database"'
          echo "External health check OK ✅"

          # Scope note: this step runs AFTER the remote script, so failing it
          # turns the job red without undoing anything. Broad web-content
          # assertions therefore stay in uptime.yml, where a red run is
          # information rather than an ambiguous signal on a healthy,
          # already-migrated production.
          #
          # ONE exception, and it earned its place on 2026-08-13: /app must be
          # served directly, with no redirect. It is the download link printed in
          # every WhatsApp referral message, and it is the only assertion that
          # proves the kpb_web recreation above actually took effect. Silence here is
          # what let /app stay broken through a "successful" deploy.
          if [ -n "${WEB_URL:-}" ]; then
            code="$(curl -sS -o /tmp/app.html -w '%{http_code}' "${WEB_URL}/app")"
            if [ "$code" != "200" ] || ! grep -q 'id1128659292' /tmp/app.html; then
              echo "::error::${WEB_URL}/app returned $code and/or does not carry the iOS store id."
              echo "::error::The API is deployed, migrated and healthy — this is the web layer only:"
              echo "::error::kpb_web was not recreated with the current nginx.conf, so \`location = /app\` is not active."
              exit 1
            fi
            echo "/app served directly ✅"
          else
            echo "::error::VPS_WEB_URL is not set — /app was NOT verified."
            exit 1
          fi

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
